name: Lint

on:
  push:
    branches-ignore:
      - main
      - dev
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv

      - name: Run Ruff Lint
        run: uv run --only-group dev ruff check . --output-format=github

      - name: Run Ruff Format Check
        run: uv run --only-group dev ruff format . --check
