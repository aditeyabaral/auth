name: Live Tests

# pull_request_target runs this file as it exists on the base branch, so a pull request cannot
# edit it. That is what makes it safe to hold credentials -- and why nothing here may be relaxed
# without re-reading the notes in CONTRIBUTING.
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

# The test account allows one active session, so live runs must never overlap
concurrency:
  group: live-tests
  cancel-in-progress: false

jobs:
  # Runs the pull request's own code against the real PESU Academy service. Fork pull requests
  # receive no secrets on a normal `pull_request` event, so this is the only way to exercise the
  # live tests before merge -- at the cost of running untrusted code with the test credentials.
  live-tests:
    runs-on: ubuntu-latest

    # Required reviewers on this environment hold the job until a maintainer approves it, so no
    # pull request code runs with credentials unseen. Re-approval is needed on every new push.
    environment: live-tests

    # Only the disposable test account is exposed: a secret reaches the runner only if this file
    # puts it here. Deploy hooks and registry credentials are deliberately absent, and are scoped
    # to the `staging` and `production` environments so a future workflow cannot reach them either.
    env:
      TEST_NAME: ${{ secrets.TEST_NAME }}
      TEST_PRN: ${{ secrets.TEST_PRN }}
      TEST_SRN: ${{ secrets.TEST_SRN }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      TEST_BRANCH: ${{ secrets.TEST_BRANCH }}
      TEST_PROGRAM: ${{ secrets.TEST_PROGRAM }}
      TEST_SEMESTER: ${{ secrets.TEST_SEMESTER }}
      TEST_SECTION: ${{ secrets.TEST_SECTION }}
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
      TEST_PHONE: ${{ secrets.TEST_PHONE }}
      TEST_CAMPUS: ${{ secrets.TEST_CAMPUS }}
      TEST_CAMPUS_CODE: ${{ secrets.TEST_CAMPUS_CODE }}

    steps:
      - name: Check out the pull request's code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Do not leave a usable token in .git/config for the checked-out code to pick up
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --all-groups

      # Only the live tests. The mocked suite already ran unprivileged in Pre-Commit Checks, so
      # there is no reason to execute it again with credentials in the environment.
      - name: Run the live tests
        run: uv run pytest -m secret_required --disable-warnings -v
